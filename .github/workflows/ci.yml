name: build
on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install
      - run: npm run check
      # vscode:prepublish builds the production bundle (npm run package) before packaging.
      - run: npx vsce package -o psalm-vscode-plugin.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: psalm-vscode-plugin-vsix
          path: psalm-vscode-plugin.vsix
          if-no-files-found: error
